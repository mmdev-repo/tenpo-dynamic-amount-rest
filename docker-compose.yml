services:

  app:
    image: mmdevrepo/tenpo-dynamic-amount-rest-app:v1.0.0
    container_name: tenpo-dynamic-amount-app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      tenpo_default:
        ipv4_address: 172.19.0.4
    ports:
      - "8080:8080"
    environment:
      APP_ENV: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: tenpo.123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_TIMEOUT: 10000
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15
    container_name: tenpo-dynamic-amount-db
    networks:
      tenpo_default:
        ipv4_address: 172.19.0.2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tenpo.123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7
    container_name: tenpo-dynamic-amount-redis
    networks:
      tenpo_default:
        ipv4_address: 172.19.0.3
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

networks:
  tenpo_default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16